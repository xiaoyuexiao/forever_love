<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的故事</title>
  <link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>
  <!-- 加载屏 -->
  <div id="loader" class="loader">
    <div class="loader-inner">
      <div class="loader-heart">&#10084;</div>
      <div class="loader-bar-wrap">
        <div class="loader-bar" id="loader-bar"></div>
      </div>
      <p class="loader-text" id="loader-text">加载中...</p>
    </div>
  </div>

  <!-- 背景音乐 -->
  <div id="music-btn" class="music-btn">
    <svg viewBox="0 0 24 24" width="24" height="24">
      <path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" fill="currentColor"/>
    </svg>
    <audio id="bgm" loop preload="auto">
      <source src="assets/music/wo_hai_xiang_ta.mp3" type="audio/mpeg">
    </audio>
  </div>
  <!-- 封面区 -->
  <section id="cover" class="cover">
    <div class="cover-overlay">
      <h1 class="cover-title"></h1>
      <p class="cover-subtitle"></p>
      <div class="cover-names"></div>
    </div>
    <div class="scroll-hint">
      <span>↓</span>
    </div>
  </section>

  <!-- 时间线区 -->
  <section id="timeline" class="timeline">
    <!-- JS 动态填充 -->
  </section>

  <!-- 统计区 -->
  <section id="stats" class="stats">
    <h2 class="stats-title">我们的数字</h2>
    <div class="stats-grid">
      <!-- JS 动态填充 -->
    </div>
  </section>

  <script src="js/main.js?v=14"></script>
</body>
</html>
